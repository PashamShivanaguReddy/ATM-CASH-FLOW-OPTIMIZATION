spring:
  application.name: transaction-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa.hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
  jpa.open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
server.port: ${SERVER_PORT:8085}
service.url: ${SERVICE_URL:http://localhost:8085}
jwt.secret: ${JWT_SECRET}
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
logging.level.com.atm: ${LOG_LEVEL:INFO}
