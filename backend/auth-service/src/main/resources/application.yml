spring:
  application.name: auth-service
server.port: ${SERVER_PORT:8081}
service.url: ${SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
jwt.secret: ${JWT_SECRET}
jwt.expiration-ms: ${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
bootstrap.super-admin.email: ${INITIAL_SUPER_ADMIN_EMAIL:}
bootstrap.super-admin.password: ${INITIAL_SUPER_ADMIN_PASSWORD:}
app.public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
spring.datasource.url: ${DATABASE_URL:jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username: ${DATABASE_USERNAME:sa}
spring.datasource.password: ${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
spring.jpa.open-in-view: false
app.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
logging.level.com.atm: ${LOG_LEVEL:INFO}
