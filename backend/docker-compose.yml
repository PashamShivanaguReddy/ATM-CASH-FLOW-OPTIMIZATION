name: atm-platform

networks:
  atm-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:

x-java-defaults: &java-defaults
  restart: unless-stopped
  image: atm-platform-java:local
  networks:
    - atm-network

services:
  java-runtime:
    image: atm-platform-java:local
    build:
      context: .
      dockerfile: Dockerfile.runtime
    command: ["true"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - atm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:?KAFKA_KRAFT_CLUSTER_ID is required}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - atm-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 45s

  ml-service:
    build:
      context: ../ML
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_DATA_PATH: /app/ml_dataset_final.csv
    ports:
      - "${ML_PORT:-8090}:8090"
    networks:
      - atm-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  service-registry:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/service-registry.jar"]
    environment: { SERVER_PORT: 8761, SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8761/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  config-server:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/config-server.jar"]
    environment: { SERVER_PORT: 8888, SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { service-registry: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8888/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  auth-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/auth-service.jar"]
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_BASE_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  user-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/user-service.jar"]
    environment: { SERVER_PORT: 8082, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8082/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  bank-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/bank-service.jar"]
    environment: { SERVER_PORT: 8083, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8083/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  atm-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/atm-service.jar"]
    environment: { SERVER_PORT: 8084, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8084/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  transaction-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/transaction-service.jar"]
    environment: { SERVER_PORT: 8085, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", KAFKA_BOOTSTRAP_SERVERS: kafka:9092, SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8085/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  cash-inventory-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/cash-inventory-service.jar"]
    environment: { SERVER_PORT: 8086, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8086/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  prediction-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/prediction-service.jar"]
    environment: { SERVER_PORT: 8087, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", KAFKA_BOOTSTRAP_SERVERS: kafka:9092, ML_SERVICE_URL: http://ml-service:8090, ALERT_SERVICE_URL: http://alert-service:8088, SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy }, ml-service: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8087/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  alert-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/alert-service.jar"]
    environment: { SERVER_PORT: 8088, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", KAFKA_BOOTSTRAP_SERVERS: kafka:9092, SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8088/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  optimization-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/optimization-service.jar"]
    environment: { SERVER_PORT: 8089, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8089/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  notification-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/notification-service.jar"]
    environment: { SERVER_PORT: 8091, JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8091/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  analytics-service:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/analytics-service.jar"]
    environment: { SERVER_PORT: 8092, DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", DB_USERNAME: "${POSTGRES_USER}", DB_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}", SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8092/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }

  api-gateway:
    <<: *java-defaults
    command: ["java", "-jar", "/app/jars/api-gateway.jar"]
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      BANK_SERVICE_URL: http://bank-service:8083
      ATM_SERVICE_URL: http://atm-service:8084
      TRANSACTION_SERVICE_URL: http://transaction-service:8085
      CASH_INVENTORY_SERVICE_URL: http://cash-inventory-service:8086
      PREDICTION_SERVICE_URL: http://prediction-service:8087
      ALERT_SERVICE_URL: http://alert-service:8088
      OPTIMIZATION_SERVICE_URL: http://optimization-service:8089
      ANALYTICS_SERVICE_URL: http://analytics-service:8092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      atm-service: { condition: service_healthy }
      prediction-service: { condition: service_healthy }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/status"], interval: 15s, timeout: 5s, retries: 20, start_period: 5m }
