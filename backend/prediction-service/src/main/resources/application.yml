spring:
  application.name: prediction-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa.hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: prediction-service
      auto-offset-reset: earliest
      enable-auto-commit: false
server.port: ${SERVER_PORT:8087}
service.url: ${SERVICE_URL:http://localhost:8087}
alert.service.url: ${ALERT_SERVICE_URL:http://localhost:8088}
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
ml.service.url: ${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT_MS:1000}
ml.service.read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT_MS:30000}
logging.level.com.atm: ${LOG_LEVEL:INFO}
